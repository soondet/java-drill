# Явный деплой на GitHub Pages.
# Классическая сборка «из ветки» перестала запускаться на пуш: коммиты приходят,
# а прогон не создаётся вовсе. Здесь триггер описан явно, поэтому виден и чинится.
name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:        # ручной запуск кнопкой, если понадобится

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .           # сайт лежит в корне репозитория
      - id: deploy
        uses: actions/deploy-pages@v4
